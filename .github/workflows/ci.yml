name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Build and test (macOS, Python 3.14)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: macos/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv macos/.venv
          macos/.venv/bin/python -m pip install -r macos/requirements.txt
          macos/.venv/bin/python -m pip check

      - name: Check Python and shell syntax
        run: |
          macos/.venv/bin/python -m compileall -q macos/src macos/tests macos/build_mac_app.py
          bash -n run_mac.sh macos/run_mac.sh macos/launch_fm26_with_hub.sh

      - name: Build native bridge
        run: clang -arch arm64 -arch x86_64 -shared -O3 macos/native/libfmsh_bridge.c -o macos/native/libfmsh_bridge.dylib

      - name: Build local app bundle
        run: macos/.venv/bin/python macos/build_mac_app.py

      - name: Run tests
        env:
          FMSH_PASTA_DADOS: ${{ runner.temp }}/fmsh-ci-data
          FMSH_PASTA_LOCAL: ${{ runner.temp }}/fmsh-ci-local
        run: macos/.venv/bin/python -m unittest discover -s macos/tests -v
