name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Build and test (macOS, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            macos/requirements.txt
            macos/requirements-build.txt

      - name: Install dependencies
        run: |
          python -m venv macos/.venv
          macos/.venv/bin/python -m pip install -r macos/requirements-build.txt
          macos/.venv/bin/python -m pip check

      - name: Check Python and shell syntax
        run: |
          macos/.venv/bin/python -m compileall -q macos/src macos/tests macos/build_mac_app.py macos/build_release.py macos/release_entry.py macos/verify_release.py
          bash -n run_mac.sh macos/run_mac.sh macos/launch_fm26_with_hub.sh

      - name: Build native bridge
        run: clang -arch arm64 -arch x86_64 -shared -O3 macos/native/libfmsh_bridge.c -o macos/native/libfmsh_bridge.dylib

      - name: Test release publication rules
        run: macos/.venv/bin/python -m unittest discover -s .github/tests -v

      - name: Build local app bundle
        run: macos/.venv/bin/python macos/build_mac_app.py

      - name: Run tests
        timeout-minutes: 5
        env:
          FMSH_PASTA_DADOS: ${{ runner.temp }}/fmsh-ci-data
          FMSH_PASTA_LOCAL: ${{ runner.temp }}/fmsh-ci-local
        run: |
          id
          /usr/sbin/DevToolsSecurity -status
          macos/.venv/bin/python -u - <<'PY'
          import faulthandler
          import unittest

          faulthandler.enable()
          faulthandler.dump_traceback_later(120, exit=True)
          try:
              suite = unittest.defaultTestLoader.discover('macos/tests')
              result = unittest.TextTestRunner(verbosity=2).run(suite)
          finally:
              faulthandler.cancel_dump_traceback_later()
          raise SystemExit(not result.wasSuccessful())
          PY

      - name: Build and verify standalone app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          macos/.venv/bin/python -c 'import os, platform; assert platform.machine() == os.environ["EXPECTED_ARCH"]'
          macos/.venv/bin/python macos/build_release.py --output "$RUNNER_TEMP/release" --build-number "$BUILD_NUMBER"

      - name: Save tested release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/FMSeasonHub-macos-${{ matrix.arch }}.*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  release:
    name: Publish installable macOS apps
    needs: macos
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_TAG: build-${{ github.run_number }}
    steps:
      - name: Download tested apps from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-*
          merge-multiple: true
          path: artifacts

      - name: Verify release assets
        working-directory: artifacts
        run: |
          sha256sum --check FMSeasonHub-macos-arm64.zip.sha256 FMSeasonHub-macos-x86_64.zip.sha256
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          for arch in ('arm64', 'x86_64'):
              metadata = json.loads(Path(f'FMSeasonHub-macos-{arch}.json').read_text())
              assert metadata['commit'] == os.environ['RELEASE_SHA']
              assert metadata['architecture'] == arch
          PY

      - name: Publish the tested main commit
        shell: bash
        run: |
          set -euo pipefail

          current_main=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current_main" != "$RELEASE_SHA" ]]; then
            echo "Main has advanced; this older commit will not become the latest release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Reuse a successful run's tag, and refuse any tag pointing elsewhere.
          existing_tag=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$RELEASE_TAG\") | .ref")
          if [[ -n "$existing_tag" ]]; then
            tagged_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
            if [[ "$tagged_sha" != "$RELEASE_SHA" ]]; then
              echo "Release tag $RELEASE_TAG points to a different commit." >&2
              exit 1
            fi
          fi

          release_info=$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | [.draft, .prerelease, .target_commitish] | @tsv")
          if [[ -n "$release_info" ]]; then
            read -r is_draft is_prerelease release_target <<< "$release_info"
            if [[ "$is_prerelease" != "false" || "$release_target" != "$RELEASE_SHA" ]]; then
              echo "Existing release does not match this automated build." >&2
              exit 1
            fi
          fi
          if [[ -n "$release_info" && "$is_draft" == "false" ]]; then
            if [[ -z "$existing_tag" ]]; then
              echo "Published release $RELEASE_TAG is missing its tag." >&2
              exit 1
            fi
            asset_count=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '.assets | map(select(.state == "uploaded")) | length')
            if [[ "$asset_count" != "6" ]]; then
              echo "Published release has an incomplete asset set." >&2
              exit 1
            fi
            echo "Release $RELEASE_TAG already exists; no duplicate created." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          Standalone macOS apps from commit $RELEASE_SHA. Both architectures passed build, tests and relocated app startup checks.

          Requires macOS 15 or later. Download **FMSeasonHub-macos-arm64.zip** for Apple Silicon, or **FMSeasonHub-macos-x86_64.zip** for Intel. Unzip and drag **FM Season Hub.app** to **Applications**. Python and dependencies are included.

          These builds are ad-hoc signed, not Apple-notarized. On first launch, macOS may require approval in **System Settings → Privacy & Security → Open Anyway**. Do not disable Gatekeeper.

          SHA-256 checksums and build metadata are attached beside each app. [Installation details]($GITHUB_SERVER_URL/$GH_REPO/blob/$RELEASE_SHA/macos/README.md).

          [Build and test results]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)
          EOF
          if [[ -z "$release_info" ]]; then
            gh release create "$RELEASE_TAG" \
              --target "$RELEASE_SHA" \
              --title "FM Season Hub $RELEASE_TAG" \
              --notes-file "$notes" \
              --generate-notes \
              --draft
          fi
          # A failed upload leaves a draft. Retrying replaces draft assets only.
          gh release upload "$RELEASE_TAG" --clobber \
            artifacts/FMSeasonHub-macos-arm64.zip \
            artifacts/FMSeasonHub-macos-arm64.zip.sha256 \
            artifacts/FMSeasonHub-macos-arm64.json \
            artifacts/FMSeasonHub-macos-x86_64.zip \
            artifacts/FMSeasonHub-macos-x86_64.zip.sha256 \
            artifacts/FMSeasonHub-macos-x86_64.json
          gh release edit "$RELEASE_TAG" --draft=false --latest

          tagged_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
          if [[ "$tagged_sha" != "$RELEASE_SHA" ]]; then
            echo "Published release tag does not match the tested commit." >&2
            exit 1
          fi
          echo "Published [$RELEASE_TAG]($GITHUB_SERVER_URL/$GH_REPO/releases/tag/$RELEASE_TAG) from $RELEASE_SHA." >> "$GITHUB_STEP_SUMMARY"
